<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  /* ---- palette: light (default) ---- */
  :root{
    --bg:#f7f7f5; --surface:#ffffff; --ink:#1a1d21; --ink-2:#33383f;
    --line:#d9d8d4; --accent:#1c6b46; --accent-soft:#e6f1ec; --accent-ink:#10472d;
    --radius:14px; --maxw:880px;
    color-scheme:light dark; font-synthesis:none;
  }
  /* ---- palette: dark (auto) ---- */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --surface:#1d2126; --ink:#f2f3f4; --ink-2:#cdd2d8;
      --line:#2c323a; --accent:#5bbd8a; --accent-soft:#16352a; --accent-ink:#9fe3c0;
    }
  }
  /* ---- palette: manual overrides ---- */
  [data-theme="light"]{
    --bg:#f7f7f5; --surface:#ffffff; --ink:#1a1d21; --ink-2:#33383f;
    --line:#d9d8d4; --accent:#1c6b46; --accent-soft:#e6f1ec; --accent-ink:#10472d;
  }
  [data-theme="dark"]{
    --bg:#14171a; --surface:#1d2126; --ink:#f2f3f4; --ink-2:#cdd2d8;
    --line:#2c323a; --accent:#5bbd8a; --accent-soft:#16352a; --accent-ink:#9fe3c0;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.7; font-size:18px; letter-spacing:.1px;
  }
  .skip{position:absolute; left:-9999px; top:0; background:var(--accent); color:#fff;
        padding:12px 18px; border-radius:0 0 10px 0; z-index:100; font-weight:700}
  .skip:focus{left:0}
  a{color:var(--accent); text-decoration:none; border-bottom:1px solid transparent}
  a:hover{border-bottom-color:var(--accent)}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:4px}

  .layout{display:grid; grid-template-columns:240px minmax(0,1fr); gap:0; max-width:1180px; margin:0 auto}
  /* sidebar TOC */
  nav.toc{position:sticky; top:0; align-self:start; max-height:100vh; overflow:auto;
          padding:40px 18px 40px 28px; border-right:1px solid var(--line)}
  nav.toc .toc-title{font-size:14px; letter-spacing:.12em; text-transform:uppercase;
                     color:var(--ink-2); font-weight:700; margin:0 0 14px}
  nav.toc a{display:block; padding:8px 12px; border-radius:8px; color:var(--ink-2);
            font-size:16px; border-bottom:none; margin-bottom:2px}
  nav.toc a:hover{background:var(--accent-soft); color:var(--accent-ink)}
  nav.toc a[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:700}

  main{padding:48px 40px 120px; max-width:var(--maxw)}
  header.page{margin-bottom:48px}
  h1{font-size:40px; line-height:1.15; margin:0 0 20px; letter-spacing:-.5px}
  .lead{font-size:21px; color:var(--ink); max-width:68ch; margin:0}
  h2{font-size:28px; margin:0 0 12px; letter-spacing:-.3px}
  h3{font-size:21px; margin:24px 0 8px}
  p,li{font-size:18px}
  section{margin-top:56px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px 26px}

  /* theme toggle */
  .toolbar{position:fixed; top:16px; right:18px; z-index:50}
  .toggle{display:inline-flex; align-items:center; gap:8px; background:var(--surface);
          color:var(--ink); border:1px solid var(--line); border-radius:999px;
          padding:9px 16px; font-size:15px; font-weight:600; cursor:pointer}
  .toggle:hover{border-color:var(--accent)}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    nav.toc{position:static; max-height:none; border-right:none; border-bottom:1px solid var(--line);
            padding:24px 20px}
    main{padding:32px 20px 80px}
    h1{font-size:32px}
  }
  @media (prefers-reduced-motion: no-preference){
    html{scroll-behavior:smooth}
    .toggle,nav.toc a{transition:background .15s,border-color .15s,color .15s}
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="toolbar">
  <button class="toggle" id="themeToggle" type="button" aria-label="Toggle light or dark theme">
    <span id="themeIcon">☾</span><span id="themeLabel">Dark</span>
  </button>
</div>

<div class="layout">
  <nav class="toc" aria-label="Contents">
    <p class="toc-title">Contents</p>
    <a href="#intro" aria-current="true">Intro</a>
    <!-- one <a href="#section-id"> per section -->
  </nav>

  <main id="main">
    <header class="page">
      <h1>{{TITLE}}</h1>
      <p class="lead">{{LEAD}}</p>
    </header>

    <section id="intro" aria-labelledby="intro-h">
      <h2 id="intro-h">Section title</h2>
      <p>Body content. Replace this scaffold with real sections.</p>
    </section>
  </main>
</div>

<!-- Agent-readable source mirror — keep in sync with the visible content -->
<script type="text/markdown" id="artifact-source">
# {{TITLE}}

{{LEAD}}

## Section title
Body content...
</script>

<script>
  (function(){
    var root=document.documentElement, btn=document.getElementById('themeToggle');
    var icon=document.getElementById('themeIcon'), label=document.getElementById('themeLabel');
    function sysDark(){return window.matchMedia('(prefers-color-scheme: dark)').matches;}
    function current(){return root.dataset.theme || (sysDark()?'dark':'light');}
    function render(){var d=current()==='dark'; icon.textContent=d?'☀':'☾'; label.textContent=d?'Light':'Dark';}
    try{var saved=localStorage.getItem('artifact-theme'); if(saved){root.dataset.theme=saved;}}catch(e){}
    render();
    btn.addEventListener('click',function(){
      var next=current()==='dark'?'light':'dark'; root.dataset.theme=next;
      try{localStorage.setItem('artifact-theme',next);}catch(e){} render();
    });

    // scrollspy for the sidebar TOC
    var links=[].slice.call(document.querySelectorAll('nav.toc a'));
    var map={}; links.forEach(function(a){var id=a.getAttribute('href').slice(1); map[id]=a;});
    if('IntersectionObserver' in window){
      var obs=new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(en.isIntersecting){
            links.forEach(function(a){a.removeAttribute('aria-current');});
            if(map[en.target.id]) map[en.target.id].setAttribute('aria-current','true');
          }
        });
      },{rootMargin:'-20% 0px -70% 0px'});
      document.querySelectorAll('main section[id]').forEach(function(s){obs.observe(s);});
    }
  })();
</script>
</body>
</html>
