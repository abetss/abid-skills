<!--
PATTERN: triage-board
WHEN: the whole artifact is a drag-and-drop prioritization board — sorting tickets / tasks / ideas into ranked columns (Now / Next / Later / Cut or similar) and exporting the result as markdown. Use INSTEAD of composing shell.html sections.
AVOID: static status reports or read-only tables — compose those from components instead.
HOW TO USE: copy this whole file, replace the COLUMNS and INITIAL data arrays (and the demo header text) with the real items. The render, drag/drop, tag filter, reset, and copy-as-markdown logic is generic. Keep the artifact-source mirror in sync with the INITIAL data.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acme — Cycle 14 triage</title>
<style>
  /* ---- palette: light (default) — identical tokens to shell.html ---- */
  :root{
    --card-foreground:var(--foreground);--primary-foreground:#ffffff;--code-comment:#5b6168;--code-keyword:#9c3a2c;--code-string:#155e3b;--code-number:#7a4f00;--code-fn:#6f42c1;--success:#1c6b46;--warning:#8a5a00;--destructive:#b4453a;
    --code-bg:#f1f1ee; --code-fg:#1a1d21; --inverse:#16191d; --inverse-foreground:#f2f3f4;
    --background:#f7f7f5; --card:#ffffff; --foreground:#1a1d21; --muted-foreground:#33383f;
    --border:#d9d8d4; --primary:#1c6b46; --accent:#e6f1ec; --accent-foreground:#10472d;
    --radius:14px; --maxw:1600px;
    color-scheme:light dark; font-synthesis:none;
    /* fixed values for use ON --inverse surfaces (both themes) */
    --inverse-muted-foreground:#b9bec5;
    /* type stacks (system fonts only — no web fonts) */
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  /* ---- palette: dark (auto-follows the OS setting; no toggle) ---- */
  @media (prefers-color-scheme: dark){
    :root{
      --primary-foreground:#06210f;--success:#5bbd8a;--warning:#e0b357;--destructive:#e0897a;
      --code-bg:#16191d; --code-fg:#f2f3f4; --code-comment:#9aa0a8; --code-keyword:#7fd0a3; --code-string:#c9d99a; --code-number:#e0b083; --code-fn:#c9b98a;
      --background:#14171a; --card:#1d2126; --foreground:#f2f3f4; --muted-foreground:#cdd2d8;
      --border:#2c323a; --primary:#5bbd8a; --accent:#16352a; --accent-foreground:#9fe3c0;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.6;
  }
  :focus-visible{outline:3px solid var(--primary); outline-offset:2px; border-radius:4px}
  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 48px 48px 96px;
  }

  /* ---------- header ---------- */
  header { margin-bottom: 24px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted-foreground);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 36px;
    letter-spacing: -0.01em;
    margin: 8px 0 8px;
  }
  .sub {
    font-size: 18px;
    color: var(--muted-foreground);
    max-width: 72ch;
    margin: 0;
  }
  .hintline {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted-foreground);
    margin-top: 12px;
  }
  .hintline::before {
    content: "›";
    color: var(--primary);
    margin-right: 6px;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--background);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 0 14px;
    margin-bottom: 16px;
    border-bottom: 1.5px solid var(--border);
  }
  .summary {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--foreground);
    letter-spacing: 0.01em;
  }
  .summary b { color: var(--foreground); font-weight: 600; }
  .summary .dot { color: var(--muted-foreground); margin: 0 4px; }
  .spacer { flex: 1; }
  .filter-active {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent-foreground);
    background: var(--accent);
    border: 1.5px solid color-mix(in srgb, var(--accent-foreground) 35%, var(--accent));
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    display: none;
  }
  .filter-active.on { display: inline-block; }
  .filter-active:hover { border-color: var(--accent-foreground); }
  button.primary {
    background: var(--inverse);
    color: var(--inverse-foreground);
    border: 1.5px solid var(--inverse);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 18px;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  button.primary:hover { background: color-mix(in srgb, var(--inverse-foreground) 14%, var(--inverse)); }
  button.primary.copied { background: var(--success); border-color: var(--success); color: var(--primary-foreground); }
  button.ghost {
    background: transparent;
    color: var(--foreground);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 18px;
    cursor: pointer;
  }
  button.ghost:hover { border-color: var(--muted-foreground); }

  /* ---------- board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    align-items: start;
  }
  .col {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }
  .col[data-col="now"]   { border-top: 3px solid var(--primary); }
  .col[data-col="next"]  { border-top: 3px solid var(--success); }
  .col[data-col="later"] { border-top: 3px solid var(--muted-foreground); }
  .col[data-col="cut"]   { border-top: 3px solid var(--border); }
  .col.dragover {
    outline: 2px dashed var(--primary);
    outline-offset: -6px;
    background: color-mix(in srgb, var(--primary) 7%, var(--card));
  }
  .col-head {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--card);
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 16px 16px 12px;
    border-bottom: 1.5px solid var(--border);
  }
  .col-head h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 21px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .col-head .count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted-foreground);
    background: var(--background);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    min-width: 30px;
    text-align: center;
  }
  .col-body {
    padding: 12px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 64px;
  }
  .col-foot {
    border-top: 1.5px solid var(--border);
    padding: 10px 16px 14px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted-foreground);
    display: flex;
    justify-content: space-between;
  }
  .col-foot b { color: var(--foreground); font-weight: 600; }

  /* ---------- ticket card ---------- */
  .ticket {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px 11px;
    cursor: grab;
    user-select: none;
  }
  .ticket:hover {
    border-color: var(--muted-foreground);
    box-shadow: 0 1px 3px color-mix(in srgb, var(--foreground) 10%, transparent);
  }
  .ticket:active { cursor: grabbing; }
  .ticket.dragging { opacity: .4; }
  .ticket.dim { opacity: .25; }
  .ticket-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .tid {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted-foreground);
    letter-spacing: 0.01em;
  }
  .tag {
    font-family: var(--mono);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-radius: 999px;
    padding: 2px 10px 3px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .tag-bug   { background: color-mix(in srgb, var(--destructive) 14%, var(--card)); color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 40%, var(--card)); }
  .tag-feat  { background: color-mix(in srgb, var(--success) 14%, var(--card));     color: var(--success);     border-color: color-mix(in srgb, var(--success) 40%, var(--card)); }
  .tag-chore { background: var(--accent); color: var(--accent-foreground); border-color: color-mix(in srgb, var(--accent-foreground) 30%, var(--accent)); }
  .tag-debt  { background: color-mix(in srgb, var(--warning) 14%, var(--card));     color: var(--warning);     border-color: color-mix(in srgb, var(--warning) 40%, var(--card)); }
  .est {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted-foreground);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ttitle {
    font-size: 16px;
    line-height: 1.45;
    color: var(--foreground);
    margin-bottom: 9px;
  }
  .ticket-bot {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .owner {
    font-family: var(--mono);
    font-size: 14px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-foreground);
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.02em;
  }
  .owner.o2 { background: color-mix(in srgb, var(--success) 18%, var(--card)); color: var(--success); }
  .owner.o3 { background: color-mix(in srgb, var(--warning) 18%, var(--card)); color: var(--warning); }
  .owner.o4 { background: var(--background); color: var(--muted-foreground); }

  @media (max-width: 920px) {
    .board { grid-template-columns: repeat(2, 1fr); }
    .wrap { padding: 32px 20px 64px; }
  }
  @media (max-width: 560px) {
    .board { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: no-preference){
    .ticket { transition: border-color 120ms ease, box-shadow 120ms ease, opacity 120ms ease; }
  }
</style>
</head>

<script type="text/markdown" id="artifact-source">
# Acme — Cycle 14 triage

Twenty-four open Linear tickets, pre-sorted into a best guess. Drag them across Now / Next / Later / Cut until the cut feels right, then copy the result back into the planning doc as markdown.

## Now (5 · 11 pts)

- **BIR-238** Comments lost when editing offline then reloading — bug, L, JM
- **BIR-252** Billing webhook 500s on annual → monthly downgrade — bug, M, RS
- **BIR-219** Migrate workspace permissions to new ACL table — debt, L, AK
- **BIR-260** SSO login loop on Safari 17 with strict cookies — bug, S, TN

- **BIR-258** Slack integration: post on milestone close — feat, M, RS
- **BIR-221** Replace moment.js with date-fns across web — debt, L, TN
- **BIR-263** Drag-to-reorder columns on the board view — feat, M, JM
- **BIR-209** Upgrade Postgres minor + reindex search vectors — chore, M, AK
- **BIR-251** Per-doc read receipts in the share dialog — feat, L, JM
- **BIR-240** Onboarding checklist resurfaces after dismissal — bug, S, TN
- **BIR-265** Add request-id to client error reports — debt, S, RS

## Cut (4 · 11 pts)
_Not this quarter — close, dedupe, or push back to the requester._

- **BIR-198** Custom emoji reactions on comments — feat, M, EL
- **BIR-204** Native Windows desktop wrapper — feat, L, TN
- **BIR-217** AI summary of long comment threads — feat, L, JM
- **BIR-233** Public roadmap page with voting — feat, L, RS
</script>

<script>
  // ---------- data ----------
  var COLUMNS = [
    { key: 'now',   label: 'Now',   rationale: 'Blocking the v2.4 release or actively losing user data.' },
    { key: 'next',  label: 'Next',  rationale: 'High-leverage and well-scoped — start the moment Now clears.' },
    { key: 'later', label: 'Later', rationale: 'Real, but can ride to a future cycle without anyone noticing.' },
    { key: 'cut',   label: 'Cut',   rationale: 'Not this quarter — close, dedupe, or push back to the requester.' }
  ];

  var EST_PTS = { S: 1, M: 2, L: 3 };

  // tag, est, owner, col
  var INITIAL = [
    { id: 'BIR-241', title: 'Fix sync conflict toast firing twice on reconnect', tag: 'bug',   est: 'M', owner: 'AK', col: 'now' },
    { id: 'BIR-238', title: 'Comments lost when editing offline then reloading', tag: 'bug',   est: 'L', owner: 'JM', col: 'now' },
    { id: 'BIR-252', title: 'Billing webhook 500s on annual → monthly downgrade', tag: 'bug',   est: 'M', owner: 'RS', col: 'now' },
    { id: 'BIR-219', title: 'Migrate workspace permissions to new ACL table',    tag: 'debt',  est: 'L', owner: 'AK', col: 'now' },
    { id: 'BIR-260', title: 'SSO login loop on Safari 17 with strict cookies',   tag: 'bug',   est: 'S', owner: 'TN', col: 'now' },

    { id: 'BIR-244', title: 'Inline @-mention picker in doc comments',           tag: 'feat',  est: 'M', owner: 'JM', col: 'next' },
    { id: 'BIR-231', title: 'Bulk-archive completed projects from the sidebar',  tag: 'feat',  est: 'S', owner: 'EL', col: 'next' },
    { id: 'BIR-247', title: 'Activity feed: collapse repeated edit events',      tag: 'feat',  est: 'M', owner: 'TN', col: 'next' },
    { id: 'BIR-228', title: 'Notification preferences per project',              tag: 'feat',  est: 'L', owner: 'EL', col: 'next' },
    { id: 'BIR-255', title: 'Keyboard shortcut cheat-sheet overlay (⌘/)',        tag: 'feat',  est: 'S', owner: 'RS', col: 'next' },
    { id: 'BIR-236', title: 'Empty-state illustrations for new workspaces',      tag: 'chore', est: 'S', owner: 'EL', col: 'next' },
    { id: 'BIR-249', title: 'Audit log export to CSV for admins',                tag: 'feat',  est: 'M', owner: 'AK', col: 'next' },

    { id: 'BIR-213', title: 'Dark mode pass on settings + billing pages',        tag: 'chore', est: 'M', owner: 'EL', col: 'later' },
    { id: 'BIR-258', title: 'Slack integration: post on milestone close',        tag: 'feat',  est: 'M', owner: 'RS', col: 'later' },
    { id: 'BIR-221', title: 'Replace moment.js with date-fns across web',        tag: 'debt',  est: 'L', owner: 'TN', col: 'later' },
    { id: 'BIR-263', title: 'Drag-to-reorder columns on the board view',         tag: 'feat',  est: 'M', owner: 'JM', col: 'later' },
    { id: 'BIR-209', title: 'Upgrade Postgres minor + reindex search vectors',   tag: 'chore', est: 'M', owner: 'AK', col: 'later' },
    { id: 'BIR-251', title: 'Per-doc read receipts in the share dialog',         tag: 'feat',  est: 'L', owner: 'JM', col: 'later' },
    { id: 'BIR-240', title: 'Onboarding checklist resurfaces after dismissal',   tag: 'bug',   est: 'S', owner: 'TN', col: 'later' },
    { id: 'BIR-265', title: 'Add request-id to client error reports',            tag: 'debt',  est: 'S', owner: 'RS', col: 'later' },

    { id: 'BIR-198', title: 'Custom emoji reactions on comments',                tag: 'feat',  est: 'M', owner: 'EL', col: 'cut' },
    { id: 'BIR-204', title: 'Native Windows desktop wrapper',                    tag: 'feat',  est: 'L', owner: 'TN', col: 'cut' },
    { id: 'BIR-217', title: 'AI summary of long comment threads',                tag: 'feat',  est: 'L', owner: 'JM', col: 'cut' },
    { id: 'BIR-233', title: 'Public roadmap page with voting',                   tag: 'feat',  est: 'L', owner: 'RS', col: 'cut' }
  ];

  var OWNER_CLASS = { AK: 'o1', JM: 'o2', RS: 'o3', TN: 'o4', EL: 'o1' };

  var tickets = [];          // live state
  var activeFilter = null;   // tag string or null
  var dragId = null;

  // ---------- build DOM ----------
  var board = document.getElementById('board');
  var colBodies = {};
  var colCounts = {};
  var colFoots = {};

  COLUMNS.forEach(function (c) {
    var col = document.createElement('section');
    col.className = 'col';
    col.dataset.col = c.key;

    var head = document.createElement('div');
    head.className = 'col-head';
    var h2 = document.createElement('h2');
    h2.textContent = c.label;
    var count = document.createElement('span');
    count.className = 'count';
    head.appendChild(h2);
    head.appendChild(count);

    var body = document.createElement('div');
    body.className = 'col-body';

    var foot = document.createElement('div');
    foot.className = 'col-foot';

    col.appendChild(head);
    col.appendChild(body);
    col.appendChild(foot);
    board.appendChild(col);

    colBodies[c.key] = body;
    colCounts[c.key] = count;
    colFoots[c.key] = foot;

    // drop targets
    col.addEventListener('dragover', function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('dragover');
    });
    col.addEventListener('dragleave', function (e) {
      if (!col.contains(e.relatedTarget)) col.classList.remove('dragover');
    });
    col.addEventListener('drop', function (e) {
      e.preventDefault();
      col.classList.remove('dragover');
      if (!dragId) return;
      var t = tickets.find(function (x) { return x.id === dragId; });
      if (t && t.col !== c.key) { t.col = c.key; render(); }
    });
  });

  function makeCard(t) {
    var card = document.createElement('article');
    card.className = 'ticket';
    card.draggable = true;
    card.dataset.id = t.id;
    if (activeFilter && t.tag !== activeFilter) card.classList.add('dim');

    var top = document.createElement('div');
    top.className = 'ticket-top';
    var tid = document.createElement('span');
    tid.className = 'tid';
    tid.textContent = t.id;
    var tag = document.createElement('button');
    tag.type = 'button';
    tag.className = 'tag tag-' + t.tag;
    tag.textContent = t.tag;
    tag.setAttribute('aria-pressed', activeFilter === t.tag ? 'true' : 'false');
    tag.addEventListener('click', function (e) {
      e.stopPropagation();
      activeFilter = (activeFilter === t.tag) ? null : t.tag;
      render();
    });
    var est = document.createElement('span');
    est.className = 'est';
    est.textContent = t.est;
    top.appendChild(tid);
    top.appendChild(tag);
    top.appendChild(est);

    var title = document.createElement('div');
    title.className = 'ttitle';
    title.textContent = t.title;

    var bot = document.createElement('div');
    bot.className = 'ticket-bot';
    var owner = document.createElement('span');
    owner.className = 'owner ' + (OWNER_CLASS[t.owner] || 'o1');
    owner.textContent = t.owner;
    bot.appendChild(owner);

    card.appendChild(top);
    card.appendChild(title);
    card.appendChild(bot);

    card.addEventListener('dragstart', function (e) {
      dragId = t.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', t.id);
    });
    card.addEventListener('dragend', function () {
      dragId = null;
      card.classList.remove('dragging');
      document.querySelectorAll('.col.dragover').forEach(function (el) {
        el.classList.remove('dragover');
      });
    });

    return card;
  }

  function render() {
    COLUMNS.forEach(function (c) { colBodies[c.key].innerHTML = ''; });
    var counts = {};
    var pts = {};
    COLUMNS.forEach(function (c) { counts[c.key] = 0; pts[c.key] = 0; });

    tickets.forEach(function (t) {
      colBodies[t.col].appendChild(makeCard(t));
      counts[t.col] += 1;
      pts[t.col] += EST_PTS[t.est] || 0;
    });

    COLUMNS.forEach(function (c) {
      colCounts[c.key].textContent = counts[c.key];
      colFoots[c.key].innerHTML = 'estimate <b>' + pts[c.key] + ' pt' + (pts[c.key] === 1 ? '' : 's') + '</b>';
    });

    var summary = document.getElementById('summary');
    summary.innerHTML = COLUMNS.map(function (c) {
      return '<b>' + counts[c.key] + '</b>&nbsp;' + c.key;
    }).join('<span class="dot">·</span>');

    var badge = document.getElementById('filterBadge');
    if (activeFilter) {
      badge.textContent = 'filter: ' + activeFilter + ' ×';
      badge.classList.add('on');
    } else {
      badge.classList.remove('on');
    }
  }

  document.getElementById('filterBadge').addEventListener('click', function () {
    activeFilter = null;
    render();
  });

  // ---------- export ----------
  function buildMarkdown() {
    var lines = [];
    lines.push('# Acme — Cycle 14 triage');
    lines.push('');
    COLUMNS.forEach(function (c) {
      var rows = tickets.filter(function (t) { return t.col === c.key; });
      var pts = rows.reduce(function (s, t) { return s + (EST_PTS[t.est] || 0); }, 0);
      lines.push('## ' + c.label + ' (' + rows.length + ' · ' + pts + ' pts)');
      lines.push('');
      lines.push('_' + c.rationale + '_');
      lines.push('');
      rows.forEach(function (t) {
        lines.push('- **' + t.id + '** ' + t.title + ' — ' + t.tag + ', ' + t.est + ', ' + t.owner);
      });
      lines.push('');
    });
    return lines.join('\n');
  }

  var copyBtn = document.getElementById('copyBtn');
  var copyTimer = null;
  copyBtn.addEventListener('click', function () {
    var md = buildMarkdown();
    function flash() {
      copyBtn.textContent = 'Copied ✓';
      copyBtn.classList.add('copied');
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function () {
        copyBtn.textContent = 'Copy as markdown';
        copyBtn.classList.remove('copied');
      }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(flash, flash);
    } else {
      var ta = document.createElement('textarea');
      ta.value = md;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      flash();
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    tickets = INITIAL.map(function (t) { return Object.assign({}, t); });
    activeFilter = null;
    render();
  });

  // ---------- init ----------
  tickets = INITIAL.map(function (t) { return Object.assign({}, t); });
  render();
</script>
</body>
</html>
