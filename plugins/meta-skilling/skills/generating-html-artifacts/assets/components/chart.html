<!--
COMPONENT: chart
WHEN: a small data series the reader should SEE as a shape — magnitude comparison across categories (bar) or a trend across ordered points (line). 2–12 points, 1–2 series. Turns numbers skimmable in a table into a shape the eye compares instantly.
AVOID: precise value lookup (that's data-table — and keep the table too when exact values matter); more than 2 series or 12 points (clutters — use data-table); never pull in a charting CDN.
SCHEMA: per chart — type (bar | line), title, labels[] (category or point names), series[] of {name, values[]}, optional unit (suffix on value labels), optional highlight (index of the one bar/point to flag).
VARIANTS: bar (magnitude comparison), line (trend); one highlighted item via "highlight".
ASSEMBLY: copy the <style> block into the page's == COMPONENT STYLES == slot, one <figure class="c-chart" data-chart='...'> per chart into a <section>, and the <script> ONCE before the scrollspy script. data-chart is JSON inside a SINGLE-quoted attribute (double quotes inside are fine). The figcaption stays in the HTML so the takeaway is readable even with JS off.
-->
<style>
  /* chart — scoped under .c-chart */
  .c-chart{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
           padding:20px 24px; margin:24px 0}
  .c-chart-title{margin:0 0 12px; font-size:16px; font-weight:700; letter-spacing:.02em;
                 color:var(--muted-foreground); text-transform:uppercase; letter-spacing:.08em}
  .c-chart-body svg{display:block; width:100%; height:auto}
  .c-chart-legend{display:flex; gap:20px; margin-top:10px; font-size:14px; font-weight:600;
                  color:var(--muted-foreground)}
  .c-chart-legend span{display:inline-flex; align-items:center; gap:7px}
  .c-chart-legend i{width:12px; height:12px; border-radius:3px; display:inline-block}
</style>

<figure class="c-chart" data-chart='{"type":"bar","unit":"ms","highlight":2,"labels":["/search","/embed","/index","/export"],"series":[{"name":"Before the cache","values":[420,380,510,190]},{"name":"After the cache","values":[210,240,260,150]}]}'>
  <figcaption class="c-chart-title">P95 latency by endpoint — the /index rewrite is the win</figcaption>
  <div class="c-chart-body"></div>
</figure>

<figure class="c-chart" data-chart='{"type":"line","unit":"k","labels":["W1","W2","W3","W4","W5","W6","W7","W8"],"series":[{"name":"Weekly active readers","values":[12,15,14,19,24,23,29,34]}]}'>
  <figcaption class="c-chart-title">Readership doubled after the newsletter mention in week 5</figcaption>
  <div class="c-chart-body"></div>
</figure>

<script>
(function(){
  var COLORS=["var(--primary)","var(--muted-foreground)"]; // NB: --primary == --success in the brand palette, so series 2 uses the ink token for contrast
  var NS="http://www.w3.org/2000/svg";
  function el(name,attrs){var e=document.createElementNS(NS,name);for(var k in attrs)e.setAttribute(k,attrs[k]);return e;}
  document.querySelectorAll(".c-chart").forEach(function(fig){
    var d;try{d=JSON.parse(fig.getAttribute("data-chart"));}catch(e){return;}
    var body=fig.querySelector(".c-chart-body");if(!body)return;
    var W=640,H=280,ML=64,MB=42,MT=14,MR=10,pw=W-ML-MR,ph=H-MT-MB;
    var max=0;d.series.forEach(function(s){s.values.forEach(function(v){if(v>max)max=v;});});
    max=max*1.15||1;
    var fmt=function(v){return v>=100?Math.round(v):Math.round(v*10)/10;};
    var svg=el("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":fig.querySelector(".c-chart-title").textContent});
    for(var g=0;g<=4;g++){var y=MT+ph-(ph*g/4);
      svg.appendChild(el("line",{x1:ML,y1:y,x2:W-MR,y2:y,stroke:"var(--border)","stroke-width":1}));
      var t=el("text",{x:ML-8,y:y+4,"text-anchor":"end","font-size":13,fill:"var(--muted-foreground)"});
      t.textContent=fmt(max*g/4)+(d.unit||"");svg.appendChild(t);}
    var n=d.labels.length,slot=pw/n;
    if(d.type==="line"){
      d.series.forEach(function(s,si){
        var pts=s.values.map(function(v,i){return [ML+slot*(i+.5),MT+ph-ph*v/max];});
        var path=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
        svg.appendChild(el("path",{d:path,fill:"none",stroke:COLORS[si%2],"stroke-width":3,"stroke-linejoin":"round","stroke-linecap":"round"}));
        pts.forEach(function(p,i){
          var hot=d.highlight===i;
          svg.appendChild(el("circle",{cx:p[0],cy:p[1],r:hot?6:4.5,fill:hot?"var(--warning)":COLORS[si%2]}));
        });
      });
    }else{
      var bw=Math.min(44,(slot-16)/d.series.length);
      d.series.forEach(function(s,si){
        s.values.forEach(function(v,i){
          var hot=d.highlight===i;
          var h=ph*v/max,x=ML+slot*i+(slot-bw*d.series.length)/2+bw*si,y=MT+ph-h;
          svg.appendChild(el("rect",{x:x,y:y,width:bw,height:h,rx:5,fill:hot?"var(--warning)":COLORS[si%2]}));
          var t=el("text",{x:x+bw/2,y:y-7,"text-anchor":"middle","font-size":13,"font-weight":600,fill:"var(--foreground)"});
          t.textContent=v+(d.unit||"");svg.appendChild(t);
        });
      });
    }
    d.labels.forEach(function(lb,i){
      var t=el("text",{x:ML+slot*(i+.5),y:H-14,"text-anchor":"middle","font-size":13,fill:"var(--muted-foreground)"});
      t.textContent=lb;svg.appendChild(t);
    });
    body.appendChild(svg);
    if(d.series.length>1||d.series[0].name){
      var leg=document.createElement("div");leg.className="c-chart-legend";
      d.series.forEach(function(s,si){
        var sp=document.createElement("span"),sw=document.createElement("i");
        sw.style.background=COLORS[si%2];sp.appendChild(sw);sp.appendChild(document.createTextNode(s.name));leg.appendChild(sp);
      });
      body.appendChild(leg);
    }
  });
})();
</script>
