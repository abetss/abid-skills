<!--
COMPONENT: tabs
WHEN: 2–5 parallel variants of the SAME slot the reader picks between — per-language code samples, per-platform install steps, before/after states. Saves vertical space when no reader needs all variants at once.
AVOID: content every reader must see (use sections); more than 5 tabs (use sections + TOC); sequential reading (tabs hide order).
SCHEMA: per tab — short label (1–2 words) + panel content (any blocks). One tab active by default (the most common case).
VARIANTS: none structurally; panels hold any content (code-block, steps, prose).
ASSEMBLY: copy the <style> block into the page's == COMPONENT STYLES == slot, the HTML into a <section>, the <script> ONCE before the scrollspy script. IDS MUST BE UNIQUE PER INSTANCE: prefix every tab/panel id with a per-instance slug (demo uses t1-, a second instance might use t2-). Keyboard: ←/→ move between tabs.
-->
<style>
  /* tabs — scoped under .c-tabs */
  .c-tabs{margin:24px 0; border:1px solid var(--border); border-radius:var(--radius); background:var(--card)}
  .c-tabs-bar{display:flex; gap:4px; padding:8px 8px 0; border-bottom:1px solid var(--border); flex-wrap:wrap}
  .c-tabs-btn{appearance:none; border:1px solid transparent; border-bottom:none; background:none; cursor:pointer;
              font:inherit; font-size:15px; font-weight:600; color:var(--muted-foreground);
              padding:10px 16px; border-radius:10px 10px 0 0}
  .c-tabs-btn:hover{color:var(--foreground)}
  .c-tabs-btn[aria-selected="true"]{color:var(--foreground); background:var(--background);
              border-color:var(--border); position:relative; top:1px}
  .c-tabs-btn:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
  .c-tabs-panel{padding:20px 24px}
  .c-tabs-panel[hidden]{display:none}
  .c-tabs-panel>:first-child{margin-top:0}
  .c-tabs-panel>:last-child{margin-bottom:0}
</style>

<div class="c-tabs">
  <div class="c-tabs-bar" role="tablist" aria-label="Install steps per platform">
    <button class="c-tabs-btn" role="tab" id="t1-tab-mac" aria-controls="t1-panel-mac" aria-selected="true">macOS</button>
    <button class="c-tabs-btn" role="tab" id="t1-tab-linux" aria-controls="t1-panel-linux" aria-selected="false">Linux</button>
    <button class="c-tabs-btn" role="tab" id="t1-tab-win" aria-controls="t1-panel-win" aria-selected="false">Windows</button>
  </div>
  <div class="c-tabs-panel" role="tabpanel" id="t1-panel-mac" aria-labelledby="t1-tab-mac">
    <p>Install with Homebrew: <code>brew install bm-search</code>, then run <code>bm init</code> once to build the index.</p>
  </div>
  <div class="c-tabs-panel" role="tabpanel" id="t1-panel-linux" aria-labelledby="t1-tab-linux" hidden>
    <p>Grab the tarball from the releases page, untar into <code>~/.local/bin</code>, then run <code>bm init</code>.</p>
  </div>
  <div class="c-tabs-panel" role="tabpanel" id="t1-panel-win" aria-labelledby="t1-tab-win" hidden>
    <p>Use WSL2 and follow the Linux steps — the native Windows build lags one release behind.</p>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll(".c-tabs").forEach(function(root){
    var btns=[].slice.call(root.querySelectorAll(".c-tabs-btn"));
    function activate(btn){
      btns.forEach(function(b){
        var on=b===btn;
        b.setAttribute("aria-selected",on?"true":"false");
        var panel=root.querySelector("#"+b.getAttribute("aria-controls"));
        if(panel)panel.hidden=!on;
      });
    }
    btns.forEach(function(b,i){
      b.addEventListener("click",function(){activate(b);});
      b.addEventListener("keydown",function(e){
        if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
        var j=(i+(e.key==="ArrowRight"?1:btns.length-1))%btns.length;
        btns[j].focus();activate(btns[j]);e.preventDefault();
      });
    });
  });
})();
</script>
