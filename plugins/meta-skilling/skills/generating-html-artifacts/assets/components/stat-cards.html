<!--
COMPONENT: stat-cards
WHEN: a KPI band of 2-5 big-number cards — weekly status, incident impact, experiment results, before/after metrics. Gives the headline numbers at a glance before the prose.
AVOID: don't use it for more than 5 numbers (use data-table) or for metrics without a clear label/timeframe — a bare number with no context misleads.
SCHEMA: per card: value (short — number, %, duration), label (what it measures), optional delta (change vs a baseline, with direction word/glyph — never color alone), optional flag to highlight one card that needs attention.
VARIANTS: delta direction — up (good, success color), down (bad, destructive), flat (neutral); card flag via .c-stat--flag (warning left border) for the one card to look at.
ASSEMBLY: copy the <style> block into the page's == COMPONENT STYLES == slot, the HTML fragment into a <section>. No script.
-->
<style>
  /* stat-cards — scoped under .c-stats / .c-stat */
  .c-stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin:24px 0}
  .c-stat{background:var(--card); border:1px solid var(--border);
          border-radius:var(--radius); padding:20px 24px 18px}
  .c-stat--flag{border-left:4px solid var(--warning); padding-left:21px}
  .c-stat-num{font-size:40px; font-weight:700; line-height:1.15; letter-spacing:-.5px;
              color:var(--foreground); font-variant-numeric:tabular-nums}
  .c-stat-label{font-size:14px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
                color:var(--muted-foreground); margin-top:4px}
  .c-stat-delta{font-size:14px; margin-top:8px; font-weight:600}
  .c-stat-delta--up{color:var(--success)}
  .c-stat-delta--down{color:var(--destructive)}
  .c-stat-delta--flat{color:var(--muted-foreground); font-weight:400}
</style>

<div class="c-stats" role="group" aria-label="Key metrics for week 11">
  <div class="c-stat">
    <div class="c-stat-num">14</div>
    <div class="c-stat-label">PRs merged</div>
    <div class="c-stat-delta c-stat-delta--up">▲ up 3 vs week 10</div>
  </div>
  <div class="c-stat">
    <div class="c-stat-num">6</div>
    <div class="c-stat-label">Deploys</div>
    <div class="c-stat-delta c-stat-delta--flat">± 0 — on trend</div>
  </div>
  <div class="c-stat c-stat--flag">
    <div class="c-stat-num">47<span style="font-size:20px">min</span></div>
    <div class="c-stat-label">SEV-2 incident</div>
    <div class="c-stat-delta c-stat-delta--down">▼ 1 this week — see timeline</div>
  </div>
  <div class="c-stat">
    <div class="c-stat-num">99.1%</div>
    <div class="c-stat-label">Test suite pass rate</div>
    <div class="c-stat-delta c-stat-delta--up">▲ up from 97.4% after flaky-test fixes</div>
  </div>
</div>
