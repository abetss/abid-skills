<!--
COMPONENT: diagram-mermaid
WHEN: the source markdown contains a ```mermaid block. Never load mermaid at view time — pre-render each block to TWO inline SVGs (light + dark palette) with `python scripts/render_diagrams.py <source>.md` and inline the resulting fragment where the block sat. See references/depth-and-diagrams.md for the full pipeline.
AVOID: for ASCII box diagrams (use diagram-excalidraw) or for clickable, annotated flows (use flowchart).
SCHEMA: per diagram — the light-rendered SVG, the dark-rendered SVG, an aria-label naming the diagram, and a caption stating the takeaway. The raw ```mermaid source stays in the markdown source mirror, NOT in the visible HTML.
VARIANTS: none.
ASSEMBLY: the figure.diagram base styles (theme switching, caption, surface) already ship in
  assets/shell.html — there is NO CSS to paste for this component (the <style> below is a
  no-op placeholder; omit it when assembling). Paste the <figure> fragment into a <section>.
  In real use the two SVGs come from scripts/render_diagrams.py output (<source>.diagrams/
  fragments) with baked per-theme colors and per-SVG-unique internal ids; the hand-written
  demo SVGs below use shell tokens instead so this showcase instance themes itself.
-->
<style>
  /* Intentionally empty: shell.html already provides figure.diagram, .diagram-light /
     .diagram-dark theme switching, and figcaption styles. .c-diagram-mermaid exists
     only as an override hook. */
</style>

<figure class="diagram c-diagram-mermaid" role="group" aria-label="Diagram: article workflow from draft to review to publish">
  <div class="diagram-svg diagram-light">
    <!-- demo only — real pages inline the light SVG emitted by scripts/render_diagrams.py -->
    <svg viewBox="0 0 680 200" role="presentation">
      <defs>
        <marker id="c-mermaid-arrow-l" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--muted-foreground)"/>
        </marker>
      </defs>
      <rect x="40" y="72" width="160" height="56" rx="10"
            fill="var(--card)" stroke="var(--border)" stroke-width="2"/>
      <text x="120" y="106" text-anchor="middle" font-size="18" fill="var(--foreground)">Draft</text>
      <line x1="204" y1="100" x2="252" y2="100" stroke="var(--muted-foreground)" stroke-width="2"
            marker-end="url(#c-mermaid-arrow-l)"/>
      <rect x="260" y="72" width="160" height="56" rx="10"
            fill="var(--accent)" stroke="var(--primary)" stroke-width="2"/>
      <text x="340" y="106" text-anchor="middle" font-size="18" fill="var(--accent-foreground)">Review</text>
      <line x1="424" y1="100" x2="472" y2="100" stroke="var(--muted-foreground)" stroke-width="2"
            marker-end="url(#c-mermaid-arrow-l)"/>
      <rect x="480" y="72" width="160" height="56" rx="10"
            fill="var(--card)" stroke="var(--border)" stroke-width="2"/>
      <text x="560" y="106" text-anchor="middle" font-size="18" fill="var(--foreground)">Publish</text>
    </svg>
  </div>
  <div class="diagram-svg diagram-dark" aria-hidden="true">
    <!-- demo only — real pages inline the dark-palette SVG (same diagram, dark render) -->
    <svg viewBox="0 0 680 200" role="presentation">
      <defs>
        <marker id="c-mermaid-arrow-d" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--muted-foreground)"/>
        </marker>
      </defs>
      <rect x="40" y="72" width="160" height="56" rx="10"
            fill="var(--card)" stroke="var(--border)" stroke-width="2"/>
      <text x="120" y="106" text-anchor="middle" font-size="18" fill="var(--foreground)">Draft</text>
      <line x1="204" y1="100" x2="252" y2="100" stroke="var(--muted-foreground)" stroke-width="2"
            marker-end="url(#c-mermaid-arrow-d)"/>
      <rect x="260" y="72" width="160" height="56" rx="10"
            fill="var(--accent)" stroke="var(--primary)" stroke-width="2"/>
      <text x="340" y="106" text-anchor="middle" font-size="18" fill="var(--accent-foreground)">Review</text>
      <line x1="424" y1="100" x2="472" y2="100" stroke="var(--muted-foreground)" stroke-width="2"
            marker-end="url(#c-mermaid-arrow-d)"/>
      <rect x="480" y="72" width="160" height="56" rx="10"
            fill="var(--card)" stroke="var(--border)" stroke-width="2"/>
      <text x="560" y="106" text-anchor="middle" font-size="18" fill="var(--foreground)">Publish</text>
    </svg>
  </div>
  <figcaption>Every article moves Draft → Review → Publish; review is the only gate.</figcaption>
</figure>
