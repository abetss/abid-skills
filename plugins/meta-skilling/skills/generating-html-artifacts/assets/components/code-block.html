<!--
COMPONENT: code-block
WHEN: any multi-line code sample worth copying — API examples, config snippets, CLI sessions, function listings. The default way to show code.
AVOID: inline mentions of identifiers (use `code`), diffs (use diff-viewer), code that needs explanation callouts (use annotated-code).
SCHEMA: { language: short label (e.g. "typescript"), filename: optional path shown in the header, code: pre-escaped lines using the shell's syntax classes .kw/.fn/.str/.cm/.num }
VARIANTS: filename may be omitted (header shows the language label + copy button only).
ASSEMBLY: copy the <style> block into the page's == COMPONENT STYLES == slot, the HTML fragment into a <section>, and the <script> just before the scrollspy script. Multiple instances on one page are fine — the script wires every .c-codeblock it finds.
-->
<style>
  .c-codeblock{margin:24px 0; max-width:none}
  .c-codeblock-head{display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--border); border-bottom:none;
    border-radius:var(--radius) var(--radius) 0 0; padding:8px 16px}
  .c-codeblock-lang{font:600 14px/1.4 ui-monospace,Menlo,Monaco,Consolas,monospace;
    background:var(--accent); color:var(--accent-foreground);
    padding:2px 10px; border-radius:6px; white-space:nowrap}
  .c-codeblock-file{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font:14px/1.4 ui-monospace,Menlo,Monaco,Consolas,monospace; color:var(--muted-foreground)}
  .c-codeblock-copy{flex-shrink:0; font:600 14px/1.4 inherit; font-family:inherit;
    color:var(--foreground); background:var(--card);
    border:1px solid var(--border); border-radius:8px; padding:6px 14px; cursor:pointer}
  .c-codeblock-copy:hover{background:var(--accent); color:var(--accent-foreground);
    border-color:var(--accent-foreground)}
  .c-codeblock-copy.is-copied{color:var(--success); border-color:var(--success)}
  .c-codeblock pre.code{margin:0; border-radius:0 0 var(--radius) var(--radius)}
  @media (prefers-reduced-motion: no-preference){
    .c-codeblock-copy{transition:background .15s,color .15s,border-color .15s}
  }
</style>
<figure class="c-codeblock">
  <figcaption class="c-codeblock-head">
    <span class="c-codeblock-lang">typescript</span>
    <span class="c-codeblock-file">src/hooks/useDebouncedValue.ts</span>
    <button type="button" class="c-codeblock-copy" aria-label="Copy code to clipboard">Copy</button>
  </figcaption>
  <pre class="code"><code><span class="kw">import</span> { useEffect, useState } <span class="kw">from</span> <span class="str">'react'</span>;

<span class="cm">// Returns the value after it has stopped changing for `delay` ms.</span>
<span class="kw">export function</span> <span class="fn">useDebouncedValue</span>&lt;T&gt;(value: T, delay = <span class="num">250</span>): T {
  <span class="kw">const</span> [debounced, setDebounced] = <span class="fn">useState</span>(value);

  <span class="fn">useEffect</span>(() =&gt; {
    <span class="kw">const</span> timer = <span class="fn">setTimeout</span>(() =&gt; <span class="fn">setDebounced</span>(value), delay);
    <span class="kw">return</span> () =&gt; <span class="fn">clearTimeout</span>(timer);
  }, [value, delay]);

  <span class="kw">return</span> debounced;
}</code></pre>
</figure>
<script>
(function(){
  document.querySelectorAll('.c-codeblock').forEach(function(block){
    var btn = block.querySelector('.c-codeblock-copy');
    var pre = block.querySelector('pre');
    if(!btn || !pre) return;
    var label = btn.textContent;
    function feedback(text, copied){
      btn.textContent = text;
      btn.classList.toggle('is-copied', !!copied);
      setTimeout(function(){
        btn.textContent = label;
        btn.classList.remove('is-copied');
      }, 1600);
    }
    function fallbackCopy(text){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'absolute';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try{
        document.execCommand('copy');
        feedback('Copied', true);
      }catch(e){
        feedback('Copy failed', false);
      }
      document.body.removeChild(ta);
    }
    btn.addEventListener('click', function(){
      var text = pre.innerText;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(
          function(){ feedback('Copied', true); },
          function(){ fallbackCopy(text); }
        );
      }else{
        fallbackCopy(text);
      }
    });
  });
})();
</script>
