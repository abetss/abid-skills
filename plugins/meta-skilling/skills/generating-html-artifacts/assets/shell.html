<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  /* ---- palette: light (default) ---- */
  :root{
      --card-foreground:var(--foreground);--primary-foreground:#ffffff;--secondary-foreground:#ffffff;--code-comment:#5b6168;--code-keyword:#9c3a2c;--code-string:#155e3b;--code-number:#7a4f00;--code-fn:#6f42c1;--success:#1c6b46;--warning:#8a5a00;--destructive:#b4453a;
    /* code surface FOLLOWS the theme (light here, dark in @media); --inverse stays dark in both themes for dark buttons / inverted panels */
    --code-bg:#f1f1ee; --code-fg:#1a1d21; --inverse:#16191d; --inverse-foreground:#f2f3f4;
    --background:#f7f7f5; --card:#ffffff; --foreground:#1a1d21; --muted-foreground:#33383f;
    --border:#d9d8d4; --primary:#1c6b46; --accent:#e6f1ec; --accent-foreground:#10472d;
    --radius:14px; --maxw:1600px;
    color-scheme:light dark; font-synthesis:none;
  }
  /* ---- palette: dark (auto-follows the OS setting; no toggle) ---- */
  @media (prefers-color-scheme: dark){
    :root{
        --primary-foreground:#06210f;--secondary-foreground:#06210f;--success:#5bbd8a;--warning:#e0b357;--destructive:#e0897a;
      --code-bg:#16191d; --code-fg:#f2f3f4; --code-comment:#9aa0a8; --code-keyword:#7fd0a3; --code-string:#c9d99a; --code-number:#e0b083; --code-fn:#c9b98a;
      --background:#14171a; --card:#1d2126; --foreground:#f2f3f4; --muted-foreground:#cdd2d8;
      --border:#2c323a; --primary:#5bbd8a; --accent:#16352a; --accent-foreground:#9fe3c0;
    }
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--background); color:var(--foreground);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.7; font-size:18px; letter-spacing:.1px;
  }
  .skip{position:absolute; left:-9999px; top:0; background:var(--primary); color:#fff;
        padding:12px 18px; border-radius:0 0 10px 0; z-index:100; font-weight:700}
  .skip:focus{left:0}
  a{color:var(--primary); text-decoration:none; border-bottom:1px solid transparent}
  a:hover{border-bottom-color:var(--primary)}
  :focus-visible{outline:3px solid var(--primary); outline-offset:2px; border-radius:4px}

  /* ---- page frame: centered 1600px shell, sidebar TOC + fluid content ---- */
  .layout{display:grid; grid-template-columns:260px minmax(0,1fr); gap:0; max-width:var(--maxw); margin:0 auto}
  nav.toc{position:sticky; top:0; align-self:start; max-height:100vh; overflow:auto;
          padding:40px 18px 40px 28px; border-right:1px solid var(--border)}
  nav.toc .toc-title{font-size:14px; letter-spacing:.12em; text-transform:uppercase;
                     color:var(--muted-foreground); font-weight:700; margin:0 0 14px}
  nav.toc a{display:block; padding:8px 12px; border-radius:8px; color:var(--muted-foreground);
            font-size:16px; border-bottom:none; margin-bottom:2px}
  nav.toc a:hover{background:var(--accent); color:var(--accent-foreground)}
  nav.toc a[aria-current="true"]{background:var(--accent); color:var(--accent-foreground); font-weight:700}
  /* nested sub-entries: one per jump-worthy h3 (give the h3 an id) */
  nav.toc a.sub{padding-left:28px; font-size:15px}

  main{padding:48px 48px 120px; min-width:0}
  .page-footer{margin-top:64px; padding-top:24px; border-top:1px solid var(--border)}
  .page-footer p{font-size:16px; color:var(--muted-foreground)}
  header.page{margin-bottom:48px}
  h1{font-size:40px; line-height:1.15; margin:0 0 20px; letter-spacing:-.5px}
  .lead{font-size:21px; color:var(--foreground); max-width:72ch; margin:0}
  h2{font-size:28px; margin:0 0 12px; letter-spacing:-.3px}
  h3{font-size:21px; margin:24px 0 8px}
  p,li{font-size:18px}
  section{margin-top:56px}
  /* Prose stays at a readable measure; components (tables, matrices, diagrams,
     diffs, stat rows) span the full content width. */
  p,li,blockquote{max-width:72ch}

  /* generic card surface — components build on this */
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px 26px}

  /* code block — surface + text FOLLOW the theme (light-on-light, dark-on-dark), high contrast in both.
     Syntax classes (.kw/.fn/.str/.cm/.num) pull from the themed --code-* tokens, so they flip too. */
  pre.code{background:var(--code-bg); color:var(--code-fg); border:1px solid var(--border);
           border-radius:10px; padding:16px 18px; overflow-x:auto; max-width:none;
           font:14px/1.6 ui-monospace,Menlo,Monaco,Consolas,monospace}
  pre.code .kw{color:var(--code-keyword)} pre.code .fn{color:var(--code-fn)}
  pre.code .str{color:var(--code-string)} pre.code .cm{color:var(--code-comment)} pre.code .num{color:var(--code-number)}
  code{font-family:ui-monospace,Menlo,Monaco,Consolas,monospace; font-size:.88em;
       background:var(--code-bg); color:var(--code-fg); padding:2px 6px; border-radius:6px}
  pre.code code{background:none; padding:0}
  /* dark button / inverted panel — stays dark in BOTH themes (use --inverse, never --card or theme inks) */
  .btn-inverse{background:var(--inverse); color:var(--inverse-foreground); border:none;
               border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer}

  /* pre-rendered diagrams (see scripts/render_diagrams.py): one figure, two SVGs,
     the right one shown per theme. */
  figure.diagram{margin:28px 0; padding:24px; background:var(--background);
                 border:1px solid var(--border); border-radius:var(--radius);
                 overflow-x:auto; text-align:center}
  figure.diagram svg{max-width:100%; height:auto}
  /* mermaid sizes label boxes with its own (headless) font; the viewer's font can be
     wider and clip the text. Let the centered labels spill instead of clipping. */
  figure.diagram foreignObject{overflow:visible}
  figure.diagram .nodeLabel,figure.diagram .edgeLabel,figure.diagram .er.entityLabel{white-space:nowrap}
  figure.diagram figcaption{margin-top:14px; font-size:16px; color:var(--muted-foreground)}
  .diagram-dark{display:none}
  .diagram-light{display:block}
  @media (prefers-color-scheme:dark){
    .diagram-light{display:none}
    .diagram-dark{display:block}
  }

  /* == COMPONENT STYLES ==
     Paste the <style> block of each component you use (assets/components/*.html) here.
     Component CSS is scoped by its own class prefix — order doesn't matter. */

  @media (max-width:900px){
    .layout{grid-template-columns:1fr}
    nav.toc{position:static; max-height:none; border-right:none; border-bottom:1px solid var(--border);
            padding:24px 20px}
    main{padding:32px 20px 80px}
    h1{font-size:32px}
  }
  @media (prefers-reduced-motion: no-preference){
    html{scroll-behavior:smooth}
    nav.toc a{transition:background .15s,border-color .15s,color .15s}
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="layout">
  <nav class="toc" aria-label="Contents">
    <p class="toc-title">Contents</p>
    <a href="#intro" aria-current="true">Intro</a>
    <!-- one <a href="#section-id"> per section -->
  </nav>

  <main id="main">
    <header class="page">
      <h1>{{TITLE}}</h1>
      <p class="lead">{{LEAD}}</p>
    </header>

    <!-- == COMPOSITION ZONE ==
         Compose the page from assets/components/*.html fragments. One <section> per
         topic; inside each section, mix prose with whichever components fit the
         content (see references/components-catalog.md). Example: -->
    <section id="intro" aria-labelledby="intro-h">
      <h2 id="intro-h">Section title</h2>
      <p>Body content. Replace this scaffold with real sections and components.</p>
    </section>

    <footer class="page-footer">
      <p>Generated artifact · edit the markdown source and re-render.</p>
    </footer>
  </main>
</div>

<!-- Agent-readable source mirror — keep in sync with the visible content -->
<script type="text/markdown" id="artifact-source">
# {{TITLE}}

{{LEAD}}

## Section title
Body content...
</script>

<!-- == COMPONENT SCRIPTS ==
     Paste the <script> block of each interactive component here (before this script). -->
<script>
  (function(){
    // scrollspy for the sidebar TOC
    var links=[].slice.call(document.querySelectorAll('nav.toc a'));
    var map={}; links.forEach(function(a){var id=a.getAttribute('href').slice(1); map[id]=a;});
    if('IntersectionObserver' in window){
      var obs=new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(en.isIntersecting){
            links.forEach(function(a){a.removeAttribute('aria-current');});
            if(map[en.target.id]) map[en.target.id].setAttribute('aria-current','true');
          }
        });
      },{rootMargin:'-20% 0px -70% 0px'});
      document.querySelectorAll('main section[id], main h3[id]').forEach(function(s){obs.observe(s);});
    }
  })();
</script>
</body>
</html>
